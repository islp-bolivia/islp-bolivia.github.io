<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Ilustración de alfabetización estadística: gráfico de barras y puntos de datos</title>
<desc>Ilustración minimalista de un gráfico de barras ascendente, en tonos azules, con puntos de dispersión en ámbar sobre fondo claro, representando el análisis de datos.</desc>

<rect x="0" y="0" width="800" height="600" fill="#F8FAFC"/>

<line x1="60" y1="470" x2="740" y2="470" stroke="#E2E8F0" stroke-width="1.5"/>

<g>
  <rect x="90"  y="330" width="70" height="140" rx="4" fill="#BAE6FD"/>
  <rect x="190" y="260" width="70" height="210" rx="4" fill="#7DD3FC"/>
  <rect x="290" y="180" width="70" height="290" rx="4" fill="#38BDF8"/>
  <rect x="390" y="120" width="70" height="350" rx="4" fill="#0284C7"/>
  <rect x="490" y="200" width="70" height="270" rx="4" fill="#38BDF8"/>
  <rect x="590" y="270" width="70" height="200" rx="4" fill="#7DD3FC"/>
  <rect x="690" y="360" width="50" height="110" rx="4" fill="#BAE6FD"/>
</g>

<g fill="#F59E0B">
  <circle cx="110" cy="300" r="6"/>
  <circle cx="230" cy="215" r="7"/>
  <circle cx="330" cy="150" r="5"/>
  <circle cx="430" cy="95"  r="8"/>
  <circle cx="540" cy="165" r="6"/>
  <circle cx="640" cy="235" r="5"/>
  <circle cx="710" cy="330" r="6"/>
</g>

<polyline points="110,300 230,215 330,150 430,95 540,165 640,235 710,330"
  fill="none" stroke="#1E3A8A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>

<g fill="#0284C7" opacity="0.35">
  <circle cx="140" cy="120" r="3"/>
  <circle cx="600" cy="90"  r="3"/>
  <circle cx="670" cy="150" r="3"/>
  <circle cx="360" cy="60"  r="3"/>
  <circle cx="480" cy="60"  r="3"/>
</g>

</svg>
